name: Bug report
description: Report something that did not work in Muninn.
title: 'Bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the preview. Please remove private content from Markdown samples, screenshots, and logs.
  - type: textarea
    id: workflow
    attributes:
      label: What were you trying to do?
      description: Describe the reading or editing task and the Markdown involved.
      placeholder: I opened a Markdown spec and tried to...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest set of steps that shows the problem.
      placeholder: |
        1. Open a .md file in Muninn
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Muninn and VS Code versions
      placeholder: Muninn 1.0.0 Preview; VS Code 1.xx.x
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: Windows, macOS, or Linux (and version, if known)
  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: A small sanitized Markdown sample, screenshot, or error message may help.
