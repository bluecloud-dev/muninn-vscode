name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run coverage
      - name: Round-trip report freshness
        run: |
          node scripts/generate-roundtrip-report.js
          git diff --exit-code -- docs/ROUNDTRIP_REPORT.md tests/unit/round-trip/KNOWN_DEVIATIONS.md
      - run: npm run check:no-telemetry
      - run: npm audit --audit-level=high
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: tested-vsix
          path: muninn-vscode-*.vsix
          if-no-files-found: error
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        vscode: ['1.85.2', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm test
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
  packaged-ui:
    needs: quality
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            vscode: stable
          - os: ubuntu-latest
            vscode: '1.85.2'
          - os: windows-latest
            vscode: stable
          - os: macos-latest
            vscode: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: tested-vsix
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
      - if: runner.os != 'Linux'
        run: npm run test:e2e
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-${{ matrix.os }}-${{ matrix.vscode }}
          path: artifacts/e2e/**
          retention-days: 14
