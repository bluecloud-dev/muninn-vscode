name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to rehearse (vMAJOR.MINOR.PATCH); no registry publish or GitHub release'
        required: true
        type: string
      verify_credentials:
        description: 'Verify Marketplace and Open VSX publisher access without uploading'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate pre-release tag and manifest
        run: |
          node <<'NODE'
          const { version, preview } = require('./package.json');
          const tag = process.env.TAG_NAME || '';
          if (!/^v\d+\.\d+\.\d+$/.test(tag) || tag !== `v${version}`) {
            throw new Error(`Release tag ${tag || '<empty>'} must match package version v${version}`);
          }
          if (preview !== true) {
            throw new Error('This workflow publishes Preview pre-releases; keep preview: true in package.json');
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: TypeScript build
        run: npm run compile

      - name: Bundle extension
        run: npm run bundle

      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Unit tests with coverage
        run: xvfb-run -a npm run coverage

      - name: VS Code integration tests
        run: xvfb-run -a npm test

      - name: No-telemetry guard
        run: npm run check:no-telemetry

      - name: Package VSIX
        run: npm run package

      - name: Test exact packaged extension
        run: xvfb-run -a npm run test:e2e

      - name: Locate packaged VSIX
        run: |
          shopt -s nullglob
          vsix_files=(muninn-vscode-*.vsix)
          if [ "${#vsix_files[@]}" -ne 1 ]; then
            echo "Expected one packaged VSIX, found ${#vsix_files[@]}" >&2
            exit 1
          fi
          echo "VSIX_PATH=${vsix_files[0]}" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG
        run: |
          node <<'NODE'
          const fs = require('fs');

          const tagName = process.env.TAG_NAME || '';
          const version = tagName.startsWith('v') ? tagName.slice(1) : tagName;
          if (!version) throw new Error('Missing tag name/version');

          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const escapedVersion = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const headerRegex = new RegExp(`^## \\[${escapedVersion}\\].*$`, 'gm');
          const headers = [...changelog.matchAll(headerRegex)];
          if (headers.length !== 1) {
            throw new Error(`Expected one changelog section for version ${version}, found ${headers.length}`);
          }

          const headerIndex = headers[0].index;
          const startIndex = changelog.indexOf('\n', headerIndex);
          if (startIndex === -1) throw new Error('Malformed changelog section header');

          const nextHeaderRegex = /^## \[[^\]]+\]/gm;
          nextHeaderRegex.lastIndex = startIndex + 1;
          const nextHeader = nextHeaderRegex.exec(changelog);
          const endIndex = nextHeader ? nextHeader.index : changelog.length;

          const body = changelog.slice(startIndex + 1, endIndex).trim();
          fs.writeFileSync('release-notes.md', `${body}\n`);
          NODE

      - name: Retain tested release candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ env.TAG_NAME }}
          path: |
            muninn-vscode-*.vsix
            release-notes.md
            artifacts/build/package-report.json
          if-no-files-found: error
          retention-days: 14

  marketplace:
    needs: build
    if: github.event_name == 'push' || inputs.verify_credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ env.TAG_NAME }}
      - name: Verify downloaded candidate hash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const assert = require('node:assert/strict');
          const report = JSON.parse(fs.readFileSync('artifacts/build/package-report.json', 'utf8'));
          const expected = 'muninn-vscode-' + require('./package.json').version + '.vsix';
          assert.equal(report.file, expected);
          const bytes = fs.readFileSync(expected);
          assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'), report.sha256);
          fs.appendFileSync(process.env.GITHUB_ENV, 'VSIX_PATH=' + expected + '\n');
          NODE

      - name: Authenticate and verify Marketplace Contributor access
        uses: ./.github/actions/marketplace-auth
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
      - name: Publish to VS Code Marketplace
        if: github.event_name == 'push'
        run: node scripts/vsce-wrapper.js publish --azure-credential --pre-release --packagePath "$VSIX_PATH"

  openvsx:
    needs: build
    if: github.event_name == 'push' || inputs.verify_credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ env.TAG_NAME }}
      - name: Verify downloaded candidate hash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const assert = require('node:assert/strict');
          const report = JSON.parse(fs.readFileSync('artifacts/build/package-report.json', 'utf8'));
          const expected = 'muninn-vscode-' + require('./package.json').version + '.vsix';
          assert.equal(report.file, expected);
          const bytes = fs.readFileSync(expected);
          assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'), report.sha256);
          fs.appendFileSync(process.env.GITHUB_ENV, 'VSIX_PATH=' + expected + '\n');
          NODE

      - name: Verify Open VSX namespace access
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          test -n "$OVSX_PAT" || { echo '::error::Missing OVSX_PAT repository secret'; exit 1; }
          npx --no-install ovsx verify-pat
      - name: Publish to Open VSX
        if: github.event_name == 'push'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --no-install ovsx publish --packagePath "$VSIX_PATH" --pre-release

  github-release:
    needs: [build, marketplace, openvsx]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ env.TAG_NAME }}
      - name: Verify downloaded candidate hash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const assert = require('node:assert/strict');
          const report = JSON.parse(fs.readFileSync('artifacts/build/package-report.json', 'utf8'));
          const expected = 'muninn-vscode-' + require('./package.json').version + '.vsix';
          assert.equal(report.file, expected);
          const bytes = fs.readFileSync(expected);
          assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'), report.sha256);
          fs.appendFileSync(process.env.GITHUB_ENV, 'VSIX_PATH=' + expected + '\n');
          NODE

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG_NAME" "$VSIX_PATH" --title "Muninn for VS Code $TAG_NAME" --notes-file release-notes.md --prerelease
